name: Documentation

# Build the MkDocs site and deploy it to GitHub Pages.
# Enable Pages for the repository (Settings -> Pages -> Source: GitHub Actions).

on:
  push:
    branches:
      - main
    paths:
      - "lelantos/**"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
      - name: Build the site
        # mkdocstrings introspects the package statically via griffe, so the
        # heavy runtime dependencies (fitsio, picca, ...) are not required.
        # --strict is intentionally omitted: the legacy code has no type
        # annotations, which griffe reports as (harmless) warnings.
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
