;############################################################################
; LELANTOS - interface_explanatory.ini
;----------------------------------------------------------------------------
; Fully commented reference version of interface_example.ini.
;
; This file drives the end-to-end tomography pipeline run by:
;
;     lelantos_interface.py  interface_explanatory.ini
;
; It is parsed by ``lelantos.interface.main`` with a customised
; ``configparser.ConfigParser``. Every value is read through a typed getter:
;
;     getstr / getint / getfloat        -> scalar
;     gettupleint / gettuplefloat       -> comma separated list, e.g. "2,2,300"
;     gettuplestr                       -> comma separated strings
;     getdict                           -> Python-literal dict, e.g. {"n": 8}
;     getboolean                        -> True / False
;
; SPECIAL VALUE ``None``
;   For every scalar getter, the literal string ``None`` is parsed to the
;   Python object ``None``. Use it to explicitly disable an option.
;
; MANDATORY vs OPTIONAL (as used in the comments below)
;   * MANDATORY : the key MUST be present AND hold a real (non-None) value
;                 whenever the stage that reads it is enabled in [main].
;                 A missing key raises configparser.NoOptionError at runtime.
;   * OPTIONAL  : the key must still be present when its stage runs, but it
;                 may be set to ``None`` to disable the associated behaviour.
;
; STAGE GATES
;   The booleans in [main] switch each pipeline stage on/off. An option is only
;   read when its owning stage is enabled, so options in a disabled section can
;   be left as placeholders (but the key should stay present to be safe).
;
; UNITS
;   RA / Dec in degrees, redshift dimensionless, comoving distances and box
;   sizes/shapes in Mpc.h^-1, thresholds are flux-contrast (delta) values.
;############################################################################


;============================================================================
[main]
;   Master switchboard: output location, per-stage on/off gates, run name.
;----------------------------------------------------------------------------

; MANDATORY. Root output directory. Created if missing. All stage sub-folders
; (pixel/, tomography/, void/, plot_*/ ...) are created underneath it.
path = ./mock_test

; MANDATORY (getboolean). Stage gate: shuffle/subsample the input delta files
; before conversion (see [delta transform]).
transform_delta = True

; MANDATORY (getboolean). Stage gate: convert delta files -> pixel/binary input
; for the tomographic solver (see [delta convert]).
convert_delta = True

; MANDATORY (getboolean). Stage gate: run the tomographic mapping solver
; (see [tomography launching] + [tomography software]).
launch_tomography = True

; MANDATORY (getboolean). Stage gate: post-process solver output into a merged
; map and/or distance map (see [tomography process]).
process_tomography = True

; MANDATORY (getboolean). Stage gate: run the void finder on the map
; (see [void finder]).
find_void = True

; MANDATORY (getboolean). Stage gate: post-process the void catalog: stats,
; cuts, cross-correlation catalog (see [void process]).
process_void = True

; MANDATORY (getboolean). Stage gate: stack the map at void positions
; (see [void stack]).
stack_void = True

; MANDATORY (getboolean). Stage gate: diagnostic plots of delta files
; (see [delta plot]).
plot_delta = True

; MANDATORY (getboolean). Stage gate: diagnostic plots of the void catalog
; (see [void plot]).
plot_void = True

; MANDATORY (getboolean). Stage gate: map plots / slices (see [tomography plot]).
plot_tomography = True

; MANDATORY (getboolean). Stage gate: plot the void stack (see [stack void plot]).
plot_stack_void = True

; MANDATORY (getstr). Input delta directory (picca delta-* FITS files). When
; ``transform_delta`` is True this is overwritten by ``delta_path_out`` for the
; rest of the run.
delta_path = ./delta

; MANDATORY (getstr). Run label prefixed to output file names (launch pickle,
; plots, catalogs).
name = DR16


;============================================================================
[delta transform]
;   Read only when [main] transform_delta = True.
;   Shuffles delta files and cuts them in redshift (cosmology.DeltaModifier).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Output directory for the transformed deltas. Becomes the
; effective ``delta_path`` for all downstream stages.
delta_path_out = ./mock_test/deltas_shuffle

; OPTIONAL (getstr). Second delta set to shuffle in lock-step (e.g. a
; cross-correlation tracer). ``None`` to skip.
other_delta_path = ./delta_xcorr

; OPTIONAL (getstr). Output directory for the shuffled ``other_delta_path``.
; Required (non-None) only if ``other_delta_path`` is set. ``None`` to skip.
other_delta_path_out = ./mock_test/deltas_shuffle_xcorr

; OPTIONAL (getint). RNG seed for reproducible shuffling. ``None`` -> random.
seed = 124584

; MANDATORY (getint). Number of redshift chunks the shuffling is applied within
; (shuffle_deltas_cut_z). Controls how the sample is partitioned before shuffle.
n_cut = 11
; NOTE: the redshift window used here is taken from [delta convert] z_cut_min /
;       z_cut_max, so those must be set even for a transform-only run.


;============================================================================
[delta convert]
;   Read when convert_delta / plot_delta / process_tomography etc. are on.
;   Converts delta FITS -> solver pixel binary (cosmology.DeltaConverter) and
;   defines the survey footprint / geometry used throughout the pipeline.
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for pixel/binary output,
; property file and QSO/DLA catalogs.
pixel_path = pixel

; MANDATORY (getfloat). Matter density Omega_m of the fiducial flat-LCDM used
; for the comoving (RA,Dec,z) -> (x,y,z) transform. This is the ONLY place the
; pipeline injects a cosmology.
Omega_m = 0.3147

; MANDATORY (getfloat). Redshift footprint of the reconstructed box.
z_cut_min = 2.1
z_cut_max = 3.2

; OPTIONAL (getfloat). Angular footprint cuts in degrees. ``None`` keeps the
; full extent of the input deltas along that edge.
dec_cut_min = 52.4
dec_cut_max = 54.2
ra_cut_min = -147.5
ra_cut_max = -144.5

; OPTIONAL (getfloat). Per-pixel noise (sigma) selection on the deltas.
; ``None`` disables the corresponding bound.
sigma_min = 0.1
sigma_max = None

; MANDATORY (getstr). Sky->cartesian transform mode. Allowed values:
;   middle      : local tangent-plane box centred on the footprint mid-point
;                 (standard; most downstream code assumes "middle").
;   full_angle  : full angular treatment.
;   full        : alias handled together with full_angle.
;   cartesian   : inputs already cartesian.
coordinate_transform = middle

; OPTIONAL (getstr). Tile/replicate the box a given number of times (mock
; studies). ``None`` for no repetition.
repeat = None

; OPTIONAL (getboolean). Recenter RA so the footprint does not straddle the
; 0/360 deg wrap. ``None``/absent behaves as False. Recommended True for fields
; crossing RA = 0.
center_ra = True

; OPTIONAL (getstr). File name of the QSO catalog to write out (used later by
; [tomography plot] as the ``qso`` overlay). ``None`` to skip.
return_qso_catalog = qso_catalog.fits

; OPTIONAL (getstr). File name of the DLA catalog to write out. ``None`` to skip.
return_dla_catalog = None

; OPTIONAL (getstr). Input DLA catalog to mask/flag during conversion.
; ``None`` for none.
dla_catalog = None

; OPTIONAL (getboolean). Also emit sky (RA,Dec,z) catalogs alongside the
; cartesian ones.
return_sky_catalogs = True

; OPTIONAL (getstr). Wavelength rebinning of the deltas before conversion.
; ``None`` keeps native binning.
rebin = None

; OPTIONAL (getboolean). Produce delta property diagnostic plots during the
; conversion step.
plot_delta_properties = True

; MANDATORY (gettupleint). Number of sub-map chunks per axis for the parallel
; solver, e.g. "2,2" -> 2x2 tiles in the transverse plane.
number_chunks = 2,2

; MANDATORY (gettupleint). Pixel shape (nx,ny,nz) of ONE sub-map, e.g.
; "20,20,300". The full-map shape follows from number_chunks + overlaping.
; Use lelantos.interface.print_approximate_shape_size_from_interface_file to
; estimate a suitable value from the footprint.
shape_sub_map = 20,20,300

; MANDATORY (getfloat). Overlap in Mpc.h^-1 between adjacent sub-maps (parallel
; mode) to avoid tiling artefacts at chunk borders.
overlaping = 13

; MANDATORY (getstr). Property/pickle file name storing box geometry and pixel
; metadata. Consumed by nearly every downstream stage, so keep it consistent.
property_file_name = property_file.pickle

; MANDATORY (getstr). Conversion execution mode:
;   parallel : write per-chunk pixel binaries for the tiled solver.
;   serial   : single-box conversion.
mode = parallel


;============================================================================
[tomography software]
;   Solver identity + solver hyper-parameters (Dachshund Wiener filter).
;   Read by convert / launch / process / plot stages.
;----------------------------------------------------------------------------

; MANDATORY (getstr). Tomographic solver backend. Supported: "dachshund"
; (Wiener-filter reconstruction). "other" is a placeholder hook.
software = dachshund

; MANDATORY (getstr). File name of the solver INPUT pixel binary (written by
; convert_delta, read by launch_tomography).
name_pixel = pixel_stripe82_mocks.bin

; MANDATORY (getstr). File name of the solver OUTPUT map binary.
name_map = map_stripe82_mocks.bin

; MANDATORY (getfloat). Dachshund signal amplitude sigma_f of the Gaussian
; covariance model.
sigmaf = 0.01

; MANDATORY (getfloat). Transverse correlation length l_perp (Mpc.h^-1).
lperp = 13

; MANDATORY (getfloat). Radial correlation length l_par (Mpc.h^-1).
lpar = 13


;============================================================================
[delta plot]
;   Read only when [main] plot_delta = True (cosmology.DeltaAnalyzer).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for the delta plots.
plot_delta_path = plot_delta

; MANDATORY (getboolean). Also make a comparison run against ``comparison``.
plot_comparison = False

; MANDATORY (getboolean). Histogram plots of the requested value_names.
plot_histo = True

; MANDATORY (getboolean). Mean-vs-redshift trend plots.
plot_mean_z_dependence = True

; MANDATORY (getboolean). Full 2D value-vs-redshift plots (heavier).
plot_z_dependence = False

; MANDATORY (getboolean). Sky (RA,Dec) scatter plots of the deltas.
plot_ra_dec = True

; OPTIONAL (getboolean). Recenter RA for the sky plots (see [delta convert]).
center_ra = True

; MANDATORY (getboolean). Interpret/plot angles in degrees (False -> radians).
degree = True

; MANDATORY (gettuplestr). Quantities to plot. Available: snr, delta, sigma,
; redshift.
value_names = snr , delta , sigma , redshift

; OPTIONAL (getstr). Path to a second delta set for comparison. Required
; (non-None) only if plot_comparison = True.
comparison = None

; OPTIONAL (gettuplestr). Legend labels for the comparison. ``None`` -> defaults.
comparison_legend = None

; MANDATORY (getboolean). Print summary statistics to the log.
print_stats = True

; MANDATORY (getdict). Matplotlib/binning options forwarded to the plotter.
; Keys are histogram bin counts and axis limits; see cosmology.DeltaAnalyzer.plot.
plot_args = {"sigma_bins" : 36,
  "sigma_z_bins" : 50,
  "sigma_min": 0.0,
  "sigma_max" : 2.0,
  "sigma_outlier_insensitive" : False,
  "delta_bins" : 100,
  "delta_z_bins" : 20,
  "delta_min_lim": -2.0,
  "delta_max_lim" : 2.0,
  "delta_linestyle" : "None",
  "delta_lambda_rest" : True,
  "delta_lambda_obs" : False,
  "delta_color" : 'b',
  "ra_bins" : 20,
  "snr_norm" : True,
  "snr_bins" : 100,
  "snr_z_bins": 30}


;============================================================================
[tomography launching]
;   Read only when [main] launch_tomography = True (task_manager.TomographyManager).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) where solver jobs run and
; the map is written.
tomo_path = tomography

; OPTIONAL (getstr). If set, run inside symlinks pointing at this folder
; (useful on clusters with scratch filesystems). ``None`` to run in place.
symlink_folder = None

; MANDATORY (getstr). Job launcher backend. Allowed: "bash" (local shell),
; "irene", "nersc" (SLURM-style clusters).
machine = bash

; MANDATORY (getdict). Launcher options merged into the job template. For
; machine=bash the relevant key is "n" (number of parallel processes),
; e.g. {"n": 8}. Cluster machines accept queue/account/time keys.
dict_launch = {"n": 8}


;============================================================================
[tomography process]
;   Read when process_tomography (and later stages) are on.
;----------------------------------------------------------------------------

; MANDATORY (getboolean). Merge per-chunk solver outputs into one map.
merge_output_maps = True

; MANDATORY (getboolean). Build a map of the distance from each voxel to the
; nearest line-of-sight (used for border/distance void cuts and plot masking).
create_distance_map = True

; MANDATORY (getstr). File name of the merged reconstructed map.
map_name = map_reconstructed.bin

; OPTIONAL (getstr). File name of the distance map. Required (non-None) if
; create_distance_map = True or if downstream DIST/border cuts / masks are used.
name_dist_map = dist_map_to_los.bin

; MANDATORY (getint). Number of processes for distance-map computation.
number_process = 1

; MANDATORY (getfloat). Local search radius (Mpc.h^-1) when assigning the
; nearest-LOS distance per voxel.
radius_local = 50


;============================================================================
[void finder]
;   Read only when [main] find_void = True (voidfinder.VoidFinder).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for the void catalog.
void_path = void

; MANDATORY (getboolean). Resume from a previous partial run if products exist.
restart = True

; MANDATORY (getint). Number of parallel processes for the finder.
number_process = 32

; MANDATORY (getfloat). Minimal void radius (Mpc.h^-1) considered.
minimal_radius = 4

; MANDATORY (getfloat). Maximal void radius (Mpc.h^-1) considered.
maximal_radius = 50

; MANDATORY (getstr). Void finding algorithm. Allowed:
;   SPHERICAL : grow spheres around under-density seeds below ``threshold``.
;   WATERSHED : watershed segmentation of the density field.
method_finder = SPHERICAL

; MANDATORY (getfloat). Flux-contrast (delta) threshold below which a voxel is
; a void seed (SPHERICAL).
threshold = 0.14

; MANDATORY (getfloat). Mean flux-contrast level used to normalise the field.
average = 0.12

; MANDATORY (getfloat). Radius growth step (Mpc.h^-1) for the spherical finder.
radius_step = 1

; MANDATORY (getstr). Overlap-resolution policy when two voids overlap:
;   ITERATION : iteratively delete the less significant overlapping void.
;   CLUSTERS  : merge overlapping voids into clusters (uses dist_clusters).
;   NONE      : keep all voids, no deletion.
delete_option = ITERATION

; MANDATORY (gettupleint). Tile the map for parallel finding, e.g. "2,2".
split_map = 2,2

; MANDATORY (gettupleint). Overlap (pixels) between tiles, e.g. "20,20".
split_overlap = 20,20

; --- The two keys below are READ BY THE CODE but absent from
;     interface_example.ini. Add them to avoid a NoOptionError. ---

; MANDATORY (getboolean). Merge nearby void seeds into clusters before growth.
; Set False for the plain spherical finder.
find_cluster = False

; MANDATORY (getfloat). Clustering distance (Mpc.h^-1). Used when
; delete_option = CLUSTERS or find_cluster = True; set a value (e.g. 5) even if
; unused so the key is present, or the run errors.
dist_clusters = 5


;============================================================================
[void process]
;   Read only when [main] process_void = True (voidfinder post-processing).
;----------------------------------------------------------------------------

; MANDATORY (getboolean). Compute additional per-void statistics (LOS distance,
; QSO crossing) using the pixel file.
compute_void_stats = True

; MANDATORY (getboolean). Apply the cuts in ``method_cut`` and write a cut catalog.
cut_void_catalog = True

; MANDATORY (getboolean). Emit a QSO-like catalog for cross-correlation tools.
create_xcorr_catalog = True

; OPTIONAL (getstr). Explicit input void catalog file name (inside void_path).
; ``None`` -> use the catalog produced by [void finder] in this run.
void_catalog = Catalog_Voids_SPHERICAL_0.14threshold_0.12average_4.0rmin_ITERATION_deletion.fits

; MANDATORY (gettuplestr). Cuts to apply, any subset of:
;   CROSSING : remove voids crossing too few/many QSO lines of sight.
;   RADIUS   : keep voids within cut_radius = (rmin,rmax).
;   BORDER   : remove voids touching the box border.
;   DIST     : remove voids in poorly-sampled regions (uses the distance map).
method_cut = RADIUS , BORDER , DIST

; OPTIONAL (getfloat). Threshold for the CROSSING cut. Required if "CROSSING"
; is in method_cut.
cut_crossing_param = 1

; OPTIONAL (gettuplefloat). (rmin,rmax) in Mpc.h^-1 for the RADIUS cut.
; Required if "RADIUS" in method_cut.
cut_radius = 7,50

; OPTIONAL (getfloat). Distance-map radius parameter (Mpc.h^-1) for the DIST cut.
distance_map_param = 20

; OPTIONAL (getfloat). Fraction (0-1) of well-sampled voxels required within
; distance_map_param for a void to survive the DIST cut.
distance_map_percent = 0.95


;============================================================================
[void stack]
;   Read only when [main] stack_void = True (tomography.TomographyStack).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for the stack products.
stack_void_path = stack_void

; OPTIONAL (getstr). Void catalog to stack on (inside void_path). ``None`` ->
; use the catalog produced/processed earlier in this run.
void_catalog = Catalog_Voids_SPHERICAL_0.14threshold_0.12average_4.0rmin_ITERATION_deletion.fits

; MANDATORY (getstr). Catalog object type being stacked: "void", "qso" or
; "galaxy". Selects the reader and coordinate handling.
type_catalog = void

; MANDATORY (getstr). Output stack binary file name.
name_stack = stack_voids.bin

; MANDATORY (getstr). Output stack property/pickle file name.
property_file_stack = property_file_stack_void.pickle

; MANDATORY (getfloat). Half-size of the stacked cube (Mpc.h^-1) around each
; centre.
size_stack = 20

; OPTIONAL (gettupleint). Explicit pixel shape of the stack cube. ``None`` ->
; derived from size_stack and the map resolution.
shape_stack = None

; MANDATORY (getboolean). Normalise each cut-out by the void radius before
; stacking (radius-scaled stack).
normalized = False

; OPTIONAL (getstr). Coordinate conversion applied before stacking (e.g.
; "middle"/"full_angle"); must match the map transform. ``None`` -> no change.
coordinate_convert = None

; MANDATORY (getstr). Interpolation used to sample the map onto the stack grid:
; "NEAREST" or "LINEAR".
interpolation_method = LINEAR


;============================================================================
[void plot]
;   Read only when [main] plot_void = True (voidfinder.PlotVoid).
;----------------------------------------------------------------------------

; OPTIONAL (getstr). Void catalog to plot (inside void_path). ``None`` -> the
; catalog produced/processed in this run.
void_catalog = None

; MANDATORY (getstr). Sub-folder (under [main] path) for the void plots.
plot_void_path = plot_void

; MANDATORY (getboolean). Also plot a comparison catalog (``comparison``).
plot_comparison = False

; MANDATORY (gettuplestr). Void quantities to plot. Available: radius, redshift,
; central_value, los_distance.
value_names = radius , redshift , central_value , los_distance

; MANDATORY (getboolean). Histogram plots.
plot_histo = True

; MANDATORY (getboolean). Mean-vs-redshift trend plots.
plot_mean_z_dependence = True

; MANDATORY (getboolean). Full value-vs-redshift plots.
plot_z_dependence = True

; OPTIONAL (getstr). Comparison catalog path. Required if plot_comparison = True.
comparison = None

; OPTIONAL (gettuplestr). Legend labels for the comparison. ``None`` -> defaults.
comparison_legend = None

; OPTIONAL (getstr). Output name for the comparison figure. ``None`` -> default.
name_plot_comparison = None

; MANDATORY (getdict). Binning/limit options forwarded to the void plotter.
plot_args = {"central_value_bins" : 50,
  "central_value_z_bins" : 20,
  "central_value_min" : None,
  "central_value_max" : None,
  "radius_bins" : 36,
  "radius_z_bins" : 20,
  "radius_min": 5,
  "radius_max" : 40,
  "redshift_bins" : 50,
  "redshift_min": None,
  "redshift_max" : None}


;============================================================================
[tomography plot]
;   Read only when [main] plot_tomography = True (tomography.TomographyPlot).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for the map plots.
plot_tomography_path = plot_tomography

; MANDATORY (getboolean). Plot map slices (the main map figure).
plot_map = True

; MANDATORY (getboolean). Plot maps centred on catalog objects
; (uses catalog_centered / nb_plot / radius_centered).
plot_centered_maps = False

; MANDATORY (getboolean). Plot the histogram of map delta values.
plot_delta_histogram = False

; MANDATORY (getboolean). Plot a two-map delta-histogram comparison
; (uses map_comparison / legend_comparison / distance_mask_comparison).
plot_delta_histogram_comparison = False

; MANDATORY (getboolean). Plot the redshift-integrated map
; (uses zmin_integrated_map / zmax_integrated_map).
plot_integrated_map = False

; OPTIONAL (getstr). Void catalog overlaid on the map. ``None`` -> the run's
; catalog (or no voids if none exists).
void_catalog = None

; OPTIONAL (getfloat). Only overlay voids whose LOS crossing exceeds this.
; ``None`` -> no crossing filter.
minimal_void_crossing = None

; MANDATORY (getfloat). Distance-to-LOS (Mpc.h^-1) above which map voxels are
; masked in the slice plot.
criteria_distance_mask = 20

; OPTIONAL (getstr). Galaxy catalog overlay. ``None`` for none.
galaxy = None

; MANDATORY (getdict). Extensive matplotlib styling dict for map/pixel/QSO/void
; markers, colour scale, redshift axis. See tomography.TomographyPlot.
plot_args = {"map_delta_min" : -1.0,
  "map_delta_max" : 0.5,
  "map_color" : 'jet_r',
  "map_xlim_min" : 0,
  "map_interpolation" : 'bilinear',
  "map_dpi" : 200,
  "pixel_marker_size" : 2,
  "pixel_marker_edge_size" : 0.1,
  "pixel_marker":".",
  "pixel_marker_color":"k",
  "pixel_bis_on" :False,
  "pixel_bis_marker_size" :2,
  "pixel_bis_marker_edge_size" : 0.1,
  "pixel_bis_marker":".",
  "pixel_bis_grey" : "0.4",
  "pixel_bis_transparency" : 0.4,
  "qso_marker_size" : 8,
  "qso_marker":"*",
  "qso_marker_color":"k",
  "qso_marker_edge_size":1,
  "qso_bis_on" :False,
  "qso_bis_marker_size" : 8,
  "qso_bis_marker":"*",
  "qso_bis_marker_color":"k",
  "qso_bis_marker_edge_size": 0.5,
  "void_marker_color":"r",
  "void_bis_marker_color":"k",
  "color_bar_fraction" : 0.02,
  "position_redshift_axe":"other",
  "outward_redshift_axe":50}

; MANDATORY (getfloat OR getstr). Slice centre in Mpc.h^-1 along ``direction``.
; A float centres at that coordinate; the string "all" (or similar) sweeps the
; whole box. Parsed as float first, falling back to string.
center_mpc = 10

; MANDATORY (getstr). Slicing axis: "x", "y" or "z".
direction = y

; MANDATORY (getfloat). Spacing (Mpc.h^-1) between successive slices.
space = 10

; MANDATORY (getboolean). Draw the secondary redshift axis on slice plots.
redshift_axis = True

; MANDATORY (getboolean). Rotate the slice 90 degrees.
rotate = False

; OPTIONAL (gettuplefloat). Sub-box crop for plotting (xmin,xmax,...).
; ``None`` -> full box.
cut_plot = None

; MANDATORY (getint). Histogram bin count for plot_delta_histogram*.
nb_bins = 50

; MANDATORY (getboolean). Overlay a Gaussian fit on the delta histogram.
gauss_fit = True

; MANDATORY (getboolean). Normalise the delta histogram to unit area.
normalization = True

; MANDATORY (getfloat). Distance-to-LOS mask (Mpc.h^-1) for histogram voxels.
criteria_distance_mask_histo = 60

; MANDATORY (getboolean). Log-scale the histogram y-axis.
log_scale = False

; OPTIONAL (getstr). Second map for plot_delta_histogram_comparison. Required
; (non-None) if that plot is enabled.
map_comparison = None

; MANDATORY (gettuplestr). Legend labels for the comparison histogram.
legend_comparison = Mocks, Data

; OPTIONAL (getstr). Distance map for the comparison map. ``None`` -> none.
distance_mask_comparison = None

; OPTIONAL (getstr). Catalog for plot_centered_maps (inside void_path).
; Required if plot_centered_maps = True.
catalog_centered = Catalog_Voids_SPHERICAL_0.14threshold_0.12average_4.0rmin_ITERATION_deletion.fits

; MANDATORY (getint). Number of centred maps to plot.
nb_plot = 2

; MANDATORY (getfloat). Half-size (Mpc.h^-1) of each centred map cut-out.
radius_centered = 50

; MANDATORY (getfloat). Redshift/coordinate integration bounds for the
; integrated map (only used when plot_integrated_map = True).
zmin_integrated_map = 100
zmax_integrated_map = 300


;============================================================================
[stack void plot]
;   Read only when [main] plot_stack_void = True
;   (tomography.TomographyStack.plot_stack).
;----------------------------------------------------------------------------

; MANDATORY (getstr). Sub-folder (under [main] path) for the stack plots.
plot_stack_void_path = plot_stack_void

; --- NAME MISMATCH WITH interface_example.ini ---
; The code reads the two keys ``stack_name`` and ``property_stack_name``.
; interface_example.ini instead lists ``name_stack`` and ``property_file_stack``,
; which the plot stage IGNORES. Use the names below.

; OPTIONAL (getstr). Explicit stack binary to plot (inside stack_void_path).
; ``None`` -> the stack produced by [void stack] in this run.
stack_name = None

; OPTIONAL (getstr). Explicit stack property/pickle file. ``None`` -> the one
; produced by [void stack] in this run.
property_stack_name = None

; MANDATORY (getstr). Output figure base name.
name_plot = stack_voids

; MANDATORY (getboolean). Fit and overlay the stack ellipticity.
ellipticity = True

; OPTIONAL (getstr). Pixel file giving QSO distances, drawn on the stack.
; ``None`` for none.
pixel_file_qso_distance = None

; MANDATORY (getdict). Styling options forwarded to plot_stack, e.g. contour
; ``levels``.
plot_args = {"levels" : 3}
