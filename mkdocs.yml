site_name: LELANTOS
site_description: Large-scalE LymAN-alpha TOmography Suite — API reference and user guide
site_author: Corentin Ravoux
repo_url: https://github.com/corentinravoux/lelantos
repo_name: corentinravoux/lelantos

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            merge_init_into_class: true
            filters:
              - "!^_"

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Pipeline & config: pipeline.md
  - API reference:
      - Overview: api/index.md
      - interface: api/interface.md
      - cosmology: api/cosmology.md
      - tomographic_objects: api/tomographic_objects.md
      - tomography: api/tomography.md
      - voidfinder: api/voidfinder.md
      - task_manager: api/task_manager.md
      - boxdm: api/boxdm.md
      - utils: api/utils.md
      - saclaymocks: api/saclaymocks.md
